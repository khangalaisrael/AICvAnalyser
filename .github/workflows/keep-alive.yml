# Keeps the free-tier services awake:
# - Render sleeps the backend after ~15 min idle (cold start ~60s)
# - Supabase pauses the project after ~7 days without activity
name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render backend
        run: curl -fsS --retry 3 --retry-delay 20 -m 90 https://aicvanalyser-backend.onrender.com/health

      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS --retry 3 --retry-delay 20 -m 30 -o /dev/null \
            "$SUPABASE_URL/rest/v1/analyses?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
